chat_model:
  generator_kwargs:
      model: microsoft/Phi-3.5-vision-instruct
      task: "image-to-text"
      generation_kwargs:
        max_new_tokens: 300
        do_sample: false
      huggingface_pipeline_kwargs:
        torch_dtype: torch.bfloat16
        trust_remote_code: true
        _attn_implementation: eager
  generator_class: fastrag.generators.llava.Phi35VisionHFGenerator
tools:
  - type: doc_with_image
    params:
      name: imageRetriever
      description: 'useful for when you need to retrieve images to answer questions. Use the following format: {{ "input": [your tool input here ] }}.'
      pipeline_or_yaml_file: "config/empty_image_ret_pipeline.yaml"
system_tools:
  - type: image
    params:
      name: "docIndex"
      model_name_or_path: "openai/clip-vit-large-patch14"
      tool_provider_name: imageRetriever
